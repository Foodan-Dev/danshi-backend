# 旦食测试环境（danshi.test.fdueat.com）
#
# 与生产栈的区别，部署前务必知情：
#   - APP_PROFILE=dev：验证码不真发邮件，只写进 backend 日志；内容审核直接放行。
#     这是有意的——测试服的目的是让团队点得动，而不是复刻生产的外部依赖。
#   - 数据库是本机容器，与生产库完全隔离，可以随时重建。
#   - 前端镜像的 API 地址是构建期烘进去的，换地址必须重新构建镜像。

name: danshi-test

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: danshi
      POSTGRES_USER: danshi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式设置}
    volumes:
      # PostgreSQL 18 官方镜像改了推荐挂载点：挂 /var/lib/postgresql 而不是它下面的 data，
      # 否则 pg_upgrade --link 会撞上挂载点边界，容器直接判定数据目录不兼容。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danshi -d danshi"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: danshi-migrate-go:test
    restart: "no"
    command: ["-cmd", "up"]
    environment:
      DATABASE_URL: postgres://danshi:${POSTGRES_PASSWORD}@postgres:5432/danshi?sslmode=disable&TimeZone=UTC
      # danshi-migrate 复用同一份配置校验，因此这两个密钥即使迁移用不到也必须提供。
      # 值得后续改进：迁移工具应当只校验自己真正需要的配置项。
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须显式设置}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET 必须显式设置}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    image: danshi-backend-go:test
    restart: unless-stopped
    environment:
      APP_PROFILE: dev
      PORT: "8000"
      DATABASE_URL: postgres://danshi:${POSTGRES_PASSWORD}@postgres:5432/danshi?sslmode=disable&TimeZone=UTC
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须显式设置}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET 必须显式设置}
      EMAIL_VERIFICATION_REQUIRED: "true"
      ALLOWED_EMAIL_DOMAINS: "fudan.edu.cn,m.fudan.edu.cn,fdueat.com"
      CORS_ALLOW_ORIGINS: "https://danshi.test.fdueat.com"
      CORS_ALLOW_CREDENTIALS: "true"
      MODERATION_CALLBACK_TOKEN: ${MODERATION_CALLBACK_TOKEN}
      COS_BUCKET: "danshi-img-test-1314208614"
      COS_REGION: "ap-shanghai"
      COS_IMG_DOMAIN: "https://img.test.fdueat.com"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.danshi-test-api.rule: "Host(`danshi.test.fdueat.com`) && PathPrefix(`/api`)"
      traefik.http.routers.danshi-test-api.entrypoints: websecure
      traefik.http.routers.danshi-test-api.priority: "20"
      traefik.http.routers.danshi-test-api.tls: "true"
      traefik.http.routers.danshi-test-api.tls.certresolver: le
      traefik.http.routers.danshi-test-api.tls.domains[0].main: fdueat.com
      traefik.http.routers.danshi-test-api.tls.domains[0].sans: "*.fdueat.com"
      traefik.http.services.danshi-test-api.loadbalancer.server.port: "8000"

  frontend:
    image: danshi-frontend:test
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      # 优先级低于 /api，其余路径全部交给前端
      traefik.http.routers.danshi-test-web.rule: "Host(`danshi.test.fdueat.com`)"
      traefik.http.routers.danshi-test-web.entrypoints: websecure
      traefik.http.routers.danshi-test-web.priority: "10"
      traefik.http.routers.danshi-test-web.tls: "true"
      traefik.http.routers.danshi-test-web.tls.certresolver: le
      traefik.http.services.danshi-test-web.loadbalancer.server.port: "80"

volumes:
  pgdata:

networks:
  internal:
  edge:
    external: true
