name: Release

# 打 v* 标签时构建并发布：二进制 + 两个容器镜像。
# 镜像推到 GHCR，与仓库同权限，不需要额外配置 registry 凭证。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release 并上传产物
  packages: write   # 推送 GHCR 镜像

env:
  GO_VERSION: "1.26.7"
  REGISTRY: ghcr.io

jobs:
  # 发版前重新跑一遍门禁。标签是从已通过 CI 的提交上打的，
  # 但契约与 schema 断言很便宜，宁可多跑一次也不要发出一个漂移的版本。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - run: make lint
      - run: make openapi
      - run: make test

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}

      - name: 交叉编译
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            for cmd in danshi-server danshi-migrate danshi-jobs; do
              out="dist/${cmd}_${GOOS}_${GOARCH}"
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$out" "./cmd/${cmd}"
            done
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 生成 OpenAPI 产物
        run: cp api/openapi.json dist/openapi.json

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, migrate, jobs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
